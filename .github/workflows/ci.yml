# CI: the unit tests and the Postman collection on every push. The collection runs against a
# private copy of the API inside the job, so no service, secret or real API is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, without a code change: a broken dependency shows up within a week
    - cron: '50 23 * * 5'   # Friday 23:50 UTC
  workflow_dispatch:

# Grouped per event too, so the weekly run and a push run on main never cancel each other
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Postman collection tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install the locked dependencies
        run: npm ci
      - name: Lint OpenAPI contract
        run: npm run lint:api -- --format=github-actions
      - name: Unit tests, then the collection with Newman
        run: npm run test:ci

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.8.2'

      - name: Run API performance smoke test
        run: |
          mkdir -p artifacts/reports
          node src/server.js > "$RUNNER_TEMP/demo-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/health >/dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/demo-api.log"
              exit 1
            fi
            sleep 1
          done
          if ! curl --silent --fail http://127.0.0.1:4173/health >/dev/null; then
            cat "$RUNNER_TEMP/demo-api.log"
            exit 1
          fi
          k6 run --summary-export artifacts/reports/k6-summary.json tests/performance/api-smoke.js
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Newman" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the Newman test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: newman-test-reports
          path: |
            artifacts/reports/newman-*.xml
            artifacts/reports/newman-report.html
            artifacts/reports/k6-summary.json
          if-no-files-found: warn
          retention-days: 30

# CI: the unit tests and the Postman collection on every push. The collection runs against a
# private copy of the API inside the job, so no service, secret or real API is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, without a code change: a broken dependency shows up within a week
    - cron: '50 23 * * 5'   # Friday 23:50 UTC
  workflow_dispatch:

# Grouped per event too, so the weekly run and a push run on main never cancel each other
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Postman collection tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install the locked dependencies
        run: npm ci
      - name: Lint OpenAPI contract
        run: npm run lint:api -- --format=github-actions
      - name: Unit tests, then the collection with Newman
        run: npm run test:ci
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Newman" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the Newman test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: newman-test-reports
          path: |
            artifacts/reports/newman-*.xml
            artifacts/reports/newman-report.html
          if-no-files-found: warn
          retention-days: 30
